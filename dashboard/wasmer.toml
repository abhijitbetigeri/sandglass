[package]
name = "abhijitbetigeri/sandglass"
version = "0.1.2"
description = "Sandglass — admin console for Wasmer sandbox fleets"
license = "MIT"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "public"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["--port", "80", "--root", "/public"]
